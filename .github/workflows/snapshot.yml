name: Deploy Snapshot to Maven

on: 
  workflow_dispatch:
    inputs:
      build_number: 
        description: "The version of this snapshot build"
        type: number
        required: true
        
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Make Gradle wrapper executable
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Set up JDK
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      # Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set environment variables
        run: | 
          echo "AUTH_KEY_SECRET=${{ secrets.AUTH_KEY_SECRET }}" >> $GITHUB_ENV
          echo "MM_MAVEN_URL=https://maven.mosaicmodding.com/snapshot/" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ inputs.build_number }}" >> $GITHUB_ENV

      # Build mod files
      - name: Build with Gradle
        run: ./gradlew build

      # Get path of mod files
      - name: Calculate artifact names
        id: calculate_artifact_names
        run: |
          VERSION=$(awk -F '=' '/^version/ { print $2; }' gradle.properties | xargs)
          MC_VERSION=$(awk -F '=' '/^minecraft_version/ { print $2; }' gradle.properties | xargs)
          echo "neoforge=neoforge/build/libs/tessera-neoforge-${MC_VERSION}-${VERSION}.jar" >> "$GITHUB_OUTPUT"
          echo "fabric=fabric/build/libs/tessera-fabric-${MC_VERSION}-${VERSION}.jar" >> "$GITHUB_OUTPUT"
          echo "common=common/build/libs/tessera-common-${MC_VERSION}-${VERSION}.jar" >> "$GITHUB_OUTPUT"
          echo "datagen=datagen/build/libs/tessera-datagen-${MC_VERSION}-${VERSION}.jar" >> "$GITHUB_OUTPUT"

      # Build and publish Neoforge to maven
      - name: Publish Neoforge
        run: ./gradlew :neoforge:publish

      # Build and publish Fabric to maven
      - name: Publish Fabric
        run: ./gradlew :fabric:publish

      # Build and publish Fabric to maven
      - name: Publish Common
        run: ./gradlew :common:publish

      - name: Build and publish Datagen
        run: ./gradlew :datagen:publish